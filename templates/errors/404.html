{% extends "base.html" %}
{% block title %}404 - Page Not Found - HairSync{% endblock %}
{% block content %}
<section class="error-page">
    <div class="container text-center py-5">
        <div class="error-code">404</div>
        <h2 class="fw-bold mb-3" style="font-family: 'Playfair Display', serif;">Page Not Found</h2>
        <p class="text-muted mb-4 mx-auto" style="max-width: 450px;">
            The page you're looking for doesn't exist or may have been moved. Let's get you back on track.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-hs-primary">
                <i class="bi bi-house me-1"></i> Go Home
            </a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-hs-outline">
                <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
        </div>
    </div>
</section>
{% endblock %}
