{% extends "base.html" %}
{% block title %}500 - Server Error - HairSync{% endblock %}
{% block content %}
<section class="error-page">
    <div class="container text-center py-5">
        <div class="error-code">500</div>
        <h2 class="fw-bold mb-3" style="font-family: 'Playfair Display', serif;">Something Went Wrong</h2>
        <p class="text-muted mb-4 mx-auto" style="max-width: 450px;">
            We encountered an unexpected error. Our team has been notified. Please try again later.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-hs-primary">
                <i class="bi bi-house me-1"></i> Go Home
            </a>
            <a href="javascript:location.reload()" class="btn btn-hs-outline">
                <i class="bi bi-arrow-clockwise me-1"></i> Try Again
            </a>
        </div>
    </div>
</section>
{% endblock %}
