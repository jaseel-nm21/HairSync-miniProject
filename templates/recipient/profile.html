{% extends "base.html" %}

{% block title %}Medical Profile - HairSync{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 small">
                    <li class="breadcrumb-item"><a href="{{ url_for('recipient.dashboard') }}">Recipient Dashboard</a></li>
                    <li class="breadcrumb-item active">Medical Profile</li>
                </ol>
            </nav>
            <h2 class="fw-bold mb-0">Manage Recipient Medical Profile</h2>
        </div>
        <div class="d-flex gap-2">
            <a href="{{ url_for('recipient.dashboard') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white py-3 px-4 border-bottom">
                    <h5 class="fw-bold mb-0"><i class="bi bi-file-earmark-medical text-danger me-2"></i> Recipient Application Details</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('recipient.profile') }}" novalidate>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Full Name *</label>
                                <input type="text" class="form-control" id="name" name="name" 
                                       value="{{ user.name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control bg-light" id="email" 
                                       value="{{ user.email }}" readonly disabled>
                                <div class="form-text small">Account email cannot be modified directly.</div>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Contact Phone Number *</label>
                                <input type="tel" class="form-control" id="phone" name="phone" 
                                       value="{{ profile.phone if profile else '' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="dob" class="form-label">Date of Birth *</label>
                                <input type="date" class="form-control" id="dob" name="dob" 
                                       value="{{ profile.date_of_birth if profile else '' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="district" class="form-label">District / City *</label>
                                <input type="text" class="form-control" id="district" name="district" 
                                       value="{{ profile.district if profile else '' }}" required>
                            </div>
                            <div class="col-12">
                                <label for="address" class="form-label">Complete Delivery Address *</label>
                                <textarea class="form-control" id="address" name="address" rows="2" required>{{ profile.address if profile else '' }}</textarea>
                            </div>
                            <div class="col-12">
                                <label for="reason" class="form-label">Medical Condition / Reason for Requesting Wig *</label>
                                <select class="form-select" id="reason" name="reason" required>
                                    <option value="">Select reason...</option>
                                    <option value="Cancer Chemotherapy Treatment" {% if profile and profile.reason_for_wig == 'Cancer Chemotherapy Treatment' %}selected{% endif %}>Cancer Chemotherapy Treatment</option>
                                    <option value="Alopecia Areata / Totalis" {% if profile and profile.reason_for_wig == 'Alopecia Areata / Totalis' %}selected{% endif %}>Alopecia Areata / Totalis</option>
                                    <option value="Burn Injury Recovery" {% if profile and profile.reason_for_wig == 'Burn Injury Recovery' %}selected{% endif %}>Burn Injury Recovery</option>
                                    <option value="Trichotillomania" {% if profile and profile.reason_for_wig == 'Trichotillomania' %}selected{% endif %}>Trichotillomania</option>
                                    <option value="Other Medical Hair Loss" {% if profile and profile.reason_for_wig == 'Other Medical Hair Loss' %}selected{% endif %}>Other Medical Hair Loss</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('recipient.dashboard') }}" class="btn btn-light border rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-hs-primary rounded-pill px-4">
                                <i class="bi bi-check2 me-1"></i> Update Medical Profile
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
