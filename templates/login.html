{% extends "base.html" %}

{% block title %}Log In - HairSync{% endblock %}

{% block content %}
<section style="background: linear-gradient(165deg, var(--hs-accent-cream) 0%, var(--hs-accent-mint) 100%); min-height: calc(100vh - 200px);">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8 col-sm-10">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                            <i class="bi bi-person-lock"></i>
                        </div>
                        <h2 class="h3 fw-bold" style="font-family: 'Playfair Display', serif;">Welcome Back</h2>
                        <p class="text-muted small">Access your personalized HairSync portal.</p>
                    </div>

                    <!-- Quick Test Credentials Picker -->
                    <div class="p-3 mb-4 rounded-3 border" style="background: var(--hs-accent-mint);">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <small class="fw-bold text-dark"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins</small>
                            <small class="text-muted" style="font-size: 0.75rem;">Click to autofill</small>
                        </div>
                        <div class="d-flex flex-wrap gap-1">
                            <button type="button" class="btn btn-sm btn-outline-dark rounded-pill py-0 px-2 small demo-autofill" 
                                    data-email="admin@hairsync.com" data-pass="Admin@123">
                                Admin
                            </button>
                            <button type="button" class="btn btn-sm rounded-pill py-0 px-2 small demo-autofill" 
                                    style="color: var(--hs-accent-teal); border-color: var(--hs-accent-teal);"
                                    data-email="contact@hopehair.org" data-pass="Password@123">
                                Approved NGO
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-warning rounded-pill py-0 px-2 small demo-autofill text-dark" 
                                    data-email="info@gracecrown.org" data-pass="Password@123">
                                Pending NGO
                            </button>
                            <button type="button" class="btn btn-sm rounded-pill py-0 px-2 small demo-autofill" 
                                    style="color: var(--hs-primary); border: 1px solid var(--hs-primary);" data-email="donor@example.com" data-pass="Password@123">
                                Donor
                            </button>
                            <button type="button" class="btn btn-sm rounded-pill py-0 px-2 small demo-autofill" 
                                    style="color: var(--hs-secondary); border: 1px solid var(--hs-secondary);" data-email="recipient@example.com" data-pass="Password@123">
                                Recipient
                            </button>
                        </div>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" novalidate>
                        <!-- Email Input -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" 
                                       placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label mb-0">Password</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="Enter your password" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Remember Me -->
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember" value="1">
                            <label class="form-check-label small text-muted" for="remember">Keep me logged in for 24 hours</label>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-hs-primary w-100 py-2 fs-6 mb-3" id="loginSubmitBtn">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                        </button>

                        <!-- Registration Options -->
                        <div class="text-center small text-muted">
                            Don't have an account yet? 
                            <a href="{{ url_for('auth.register') }}" class="fw-bold" style="color: var(--hs-secondary);">Register here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    // Autofill demo accounts
    document.querySelectorAll('.demo-autofill').forEach(btn => {
        btn.addEventListener('click', function() {
            document.getElementById('email').value = this.getAttribute('data-email');
            document.getElementById('password').value = this.getAttribute('data-pass');
        });
    });
</script>
{% endblock %}
